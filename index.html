<script>
(function () {
  var stage = document.getElementById('stage');
  var linesSvg = document.getElementById('lines');
  var lineTop = document.getElementById('line-top');
  var lineBottom = document.getElementById('line-bottom');
  var lineSpine = document.getElementById('line-spine');

  var words = {
    netwerk: document.getElementById('w-netwerk'),
    nieuwkomers: document.getElementById('w-nieuwkomers'),
    amsterdam: document.getElementById('w-amsterdam')
  };

  var MOBILE_W = 380;
  var CORNER_INSET = 0.006;

  // each word's own viewBox has symmetric vertical padding baked in around the glyph;
  // PAD_FRAC is how far the glyph itself sits inset from its box edge (as a fraction
  // of the box height), and ASPECT is the box's own width/height ratio.
  var PAD_FRAC = {
    netwerk:     (164.8 - 112.8) / 2 / 164.8,
    nieuwkomers: (165.4 - 113.4) / 2 / 165.4,
    amsterdam:   (164.8 - 112.8) / 2 / 164.8
  };
  var ASPECT = {
    netwerk:     469.9 / 164.8,
    nieuwkomers: 767.0 / 165.4,
    amsterdam:   649.4 / 164.8
  };

  // convex-hull anchor points: each slot has one offset for its "forward" neighbor
  // (top->right->bottom->top, matching the rotation direction) and one for its
  // "backward" neighbor — these are the exact corner offsets from the original
  // hand-tuned layout, so at rest (top/bottom/right = netwerk/amsterdam/nieuwkomers)
  // this reproduces the approved look exactly, including a true 90° spine.
  var FORWARD_OFFSET  = { top: [1.14, 0.05], right: [0.90, 1.14], bottom: [0.0, -0.18] };
  var BACKWARD_OFFSET = { top: [0.0, 1.18], right: [0.90, -0.14], bottom: [1.14, 0.95] };

  // which direction each word's connection to the other two runs in — fixed
  // regardless of slot, since the rotation permutes all three words together.
  var CONN_ROLE = {
    netwerk:     { nieuwkomers: 'forward', amsterdam: 'backward' },
    nieuwkomers: { amsterdam: 'forward', netwerk: 'backward' },
    amsterdam:   { netwerk: 'forward', nieuwkomers: 'backward' }
  };

  // three interchangeable corner "slots" a word can occupy; each is provably safe
  // (stays inside the stage) on its own, and since the stage is a convex rectangle,
  // straight-line interpolation between two safe slots never leaves the stage either.
  function slotPosition(slot, key, W, H, wh, insetX, insetY) {
    var pf = PAD_FRAC[key];
    if (slot === 'top') {
      return { x: insetX, y: insetY - pf * wh };
    }
    if (slot === 'bottom') {
      return { x: insetX, y: (H - insetY) - (1 - pf) * wh };
    }
    // 'right'
    var w = wh * ASPECT[key];
    return { x: (W - insetX) - w, y: 0.44 * H - pf * wh };
  }

  // the scroll-driven rotation: each word cycles through the three slots in turn,
  // so the triangle of connections keeps its shape while it "turns" as you scroll.
  // Phase 0 matches the at-rest layout exactly (scrollY = 0 looks identical to before).
  var PHASES = [
    { netwerk: 'top',    amsterdam: 'bottom', nieuwkomers: 'right'  },
    { netwerk: 'right',  amsterdam: 'top',    nieuwkomers: 'bottom' },
    { netwerk: 'bottom', amsterdam: 'right',  nieuwkomers: 'top'    },
    { netwerk: 'top',    amsterdam: 'bottom', nieuwkomers: 'right'  }
  ];

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clampNum(min, val, max) { return Math.max(min, Math.min(max, val)); }

  var WORD_PAD_RATIO = 1.46;

  function wordHeight(vw) {
    var v = Math.max(vw, MOBILE_W);
    return clampNum(30, 0.052 * v, 60) * WORD_PAD_RATIO;
  }

  var scrollTrack = document.querySelector('.scroll-track');

  function scrollProgress() {
    var max = scrollTrack.offsetHeight - window.innerHeight;
    if (max <= 0) return 0;
    return clamp01(window.scrollY / max);
  }

  function render() {
    var vw = window.innerWidth;
    var W = stage.clientWidth;
    var H = stage.clientHeight;
    var wh = wordHeight(vw);
    stage.style.setProperty('--word-h', wh + 'px');

    var insetX = CORNER_INSET * W;
    var insetY = CORNER_INSET * H;

    var segFloat = scrollProgress() * (PHASES.length - 1);
    var segIndex = Math.min(PHASES.length - 2, Math.floor(segFloat));
    var segFrac = segFloat - segIndex;
    currentSeg = { index: segIndex, frac: segFrac };

    Object.keys(words).forEach(function (key) {
      var slotA = PHASES[segIndex][key];
      var slotB = PHASES[segIndex + 1][key];
      var pA = slotPosition(slotA, key, W, H, wh, insetX, insetY);
      var pB = slotPosition(slotB, key, W, H, wh, insetX, insetY);
      var x = lerp(pA.x, pB.x, segFrac);
      var y = lerp(pA.y, pB.y, segFrac);
      words[key].style.transform = 'translate(' + x + 'px,' + y + 'px)';
    });

    linesSvg.setAttribute('width', W);
    linesSvg.setAttribute('height', H);
    linesSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    syncLines();
  }

  var currentSeg = { index: 0, frac: 0 };

  function anchorPoint(el, fx, fy) {
    var r = el.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    return {
      x: (r.left - sr.left) + fx * r.width,
      y: (r.top - sr.top) + fy * r.height
    };
  }

  // the anchor offset (fx,fy on `word`'s own box) for its connection to `other`,
  // blended between the two slots `word` is currently interpolating between —
  // this is what keeps every corner exact (and the spine at a true 90°) no
  // matter which word currently occupies which slot.
  function connectionOffset(word, other) {
    var role = CONN_ROLE[word][other];
    var table = role === 'forward' ? FORWARD_OFFSET : BACKWARD_OFFSET;
    var slotA = PHASES[currentSeg.index][word];
    var slotB = PHASES[currentSeg.index + 1][word];
    var oA = table[slotA];
    var oB = table[slotB];
    return [lerp(oA[0], oB[0], currentSeg.frac), lerp(oA[1], oB[1], currentSeg.frac)];
  }

  function setLine(line, p1, p2) {
    line.setAttribute('x1', p1.x);
    line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x);
    line.setAttribute('y2', p2.y);
  }

  function connectLine(line, a, b) {
    var oa = connectionOffset(a, b);
    var ob = connectionOffset(b, a);
    setLine(line,
      anchorPoint(words[a], oa[0], oa[1]),
      anchorPoint(words[b], ob[0], ob[1])
    );
  }

  function syncLines() {
    connectLine(lineTop, 'netwerk', 'nieuwkomers');
    connectLine(lineBottom, 'amsterdam', 'nieuwkomers');
    connectLine(lineSpine, 'netwerk', 'amsterdam');
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      render();
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', render);

  render();
})();
</script>
